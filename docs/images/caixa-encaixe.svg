<text x="132" y="587" fill="#24292f">Caixa Patola PB-085/3 — interno 82 x 70 mm (externo 85 x 73 x 32)</text>
<text x="132" y="600" fill="#2f6f2f">Placa 80 x 66 mm — folga 1.0 mm nas laterais, 2.0 mm em cima/embaixo</text>
<text x="132" y="613" fill="#d1242f">Bossos da tampa (vermelho) a 58 mm: coincidem com os furos da placa (verde)</text>
<text x="132" y="626" fill="#8b949e">Tracejado = corpo externo (parede ~1,5 mm). Vermelho grosso = recorte necessario na parede.</text>
<text x="132" y="639" fill="#d1242f">J8: passa 8.3 mm da face externa (direita) — furo de parede</text>
<text x="132" y="652" fill="#d1242f">U1 (USB): a face fica 1.2 mm PARA DENTRO da parede — o recorte tem que deixar o plugue entrar (2.7 mm da face externa)</text>
<text x="132" y="665" fill="#d1242f">U2: passa 11.6 mm da face externa (cima) — furo de parede</text>
<text x="132" y="678" fill="#d1242f">J9: passa 8.3 mm da face externa (direita) — furo de parede</text>
